<title>Moby</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: barra lateral con módulos + área de trabajo; cada módulo es lista a la izquierda y ficha de edición a la derecha */
:root{
  --bg:#f2f5f4; --surface:#ffffff; --surface-2:#e8eeec; --line:#d3dcd9;
  --fg:#14201e; --muted:#566865; --accent:#0b6e63; --accent-fg:#ffffff; --accent-soft:#d6ebe7;
  --ok:#1d7447; --ok-bg:#dcf0e4; --warn:#8f5400; --warn-bg:#fbebcb;
  --bad:#b0261e; --bad-bg:#fbdcd9; --info:#1d5ca3; --info-bg:#dae8f8;
  --hatch1:#dfe5e3; --hatch2:#c9d2cf; --weekend:#eef2f1;
  --font:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1514; --surface:#151f1e; --surface-2:#1d2a28; --line:#2b3b38;
    --fg:#e5eeec; --muted:#93a7a3; --accent:#4fc0b0; --accent-fg:#05201b; --accent-soft:#17332f;
    --ok:#6fd39a; --ok-bg:#16301f; --warn:#f0b955; --warn-bg:#3a2a0d;
    --bad:#ff8d85; --bad-bg:#3d1a18; --info:#8bbcf2; --info-bg:#172b44;
    --hatch1:#26332f; --hatch2:#1a2522; --weekend:#18221f; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1514; --surface:#151f1e; --surface-2:#1d2a28; --line:#2b3b38;
  --fg:#e5eeec; --muted:#93a7a3; --accent:#4fc0b0; --accent-fg:#05201b; --accent-soft:#17332f;
  --ok:#6fd39a; --ok-bg:#16301f; --warn:#f0b955; --warn-bg:#3a2a0d;
  --bad:#ff8d85; --bad-bg:#3d1a18; --info:#8bbcf2; --info-bg:#172b44;
  --hatch1:#26332f; --hatch2:#1a2522; --weekend:#18221f; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.45;
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,p{margin:0}
h1{font-size:22px;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:15px;font-weight:600}
.mono{font-family:var(--mono);font-size:12.5px}
.sub{color:var(--muted);margin-top:2px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.shell{display:grid;grid-template-columns:212px minmax(0,1fr);gap:24px;max-width:1500px;margin:0 auto}
.side{position:sticky;top:max(16px,env(safe-area-inset-top,0px));align-self:start;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;flex-direction:column;gap:6px}
.brand b{font-size:17px;font-weight:600;letter-spacing:-.01em}
.brand span{color:var(--muted);font-size:12.5px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:2px 9px;width:max-content;background:var(--surface)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.chip.on i{background:var(--ok)}
.nav{display:flex;flex-direction:column;gap:14px}
.ngroup{display:flex;flex-direction:column;gap:2px}
.ngroup small{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:0 10px 4px}
.nav a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 10px;border-radius:6px;color:var(--fg);text-decoration:none}
.nav a:hover{background:var(--surface-2)}
.nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav a em{font-style:normal;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
main{min-width:0;display:flex;flex-direction:column;gap:16px}
#banner:empty{display:none}
.note{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;background:var(--info-bg);color:var(--info);border-radius:8px;padding:10px 14px}
.note.warn{background:var(--warn-bg);color:var(--warn)}
.note .btn{background:var(--surface)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0}
.pad{padding:16px}
.mhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 13px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover:not(:disabled){background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover:not(:disabled){background:var(--accent);filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger:hover:not(:disabled){background:var(--bad-bg)}
.btn.sm{padding:3px 10px;font-size:12.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}

.mod{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(340px,1fr);gap:16px;align-items:start}
.list-tools{display:flex;flex-wrap:wrap;gap:8px;padding:12px;border-bottom:1px solid var(--line)}
.list-tools input[type=search]{flex:1 1 180px;min-width:0}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 9px;min-width:0;width:100%}
.list-tools select{width:auto}
input:disabled,select:disabled,textarea:disabled{background:var(--surface-2);color:var(--fg);opacity:1;border-color:transparent;cursor:default;-webkit-text-fill-color:var(--fg)}
input[type=checkbox]{width:auto}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:500;text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--surface-2)}
tbody tr.sel{background:var(--accent-soft)}
tbody tr:last-child td{border-bottom:0}
.empty{padding:28px 16px;color:var(--muted);text-align:center}
.badge{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:500;background:var(--surface-2);color:var(--muted)}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.bad{background:var(--bad-bg);color:var(--bad)}
.badge.info{background:var(--info-bg);color:var(--info)}
.badge.acc{background:var(--accent-soft);color:var(--accent)}

.form-card{position:sticky;top:max(16px,env(safe-area-inset-top,0px))}
.ftools{display:flex;flex-wrap:wrap;gap:6px;padding:12px;border-bottom:1px solid var(--line)}
.fbody{padding:14px 16px 18px;display:flex;flex-direction:column;gap:14px}
.ftitle{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.ftitle h2{overflow-wrap:anywhere}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld.full{grid-column:1/-1}
.fld label{font-size:12px;color:var(--muted)}
.fld label b{color:var(--bad);font-weight:500}
.fld small{color:var(--muted);font-size:11.5px}
textarea{min-height:68px;resize:vertical}
.msg{padding:9px 12px;border-radius:6px;font-size:13px}
.msg.err{background:var(--bad-bg);color:var(--bad)}
.msg.ok{background:var(--ok-bg);color:var(--ok)}
.msg.ask{background:var(--warn-bg);color:var(--warn);display:flex;flex-direction:column;gap:8px}
.msg .row{display:flex;gap:6px;flex-wrap:wrap}

.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.stat{padding:14px 16px;display:flex;flex-direction:column;gap:2px;border-right:1px solid var(--line);min-width:0}
.stat:last-child{border-right:0}
.stat span{font-size:12px;color:var(--muted)}
.stat b{font-size:26px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat b.sm{font-size:20px;padding-top:5px}
.strip + .strip{border-top:1px solid var(--line)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:9px 16px;border-top:1px solid var(--line)}
.list li > div{min-width:0}
.list li p{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list li .sub{font-size:12.5px;margin:0}
.chead{padding:13px 16px 11px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.sbar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--surface-2)}
.sbar i{display:block;height:100%}
.sbar .d{background:var(--ok)} .sbar .a{background:var(--accent)} .sbar .m{background:var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:14px;color:var(--muted);font-size:12.5px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.srow{display:grid;grid-template-columns:minmax(110px,170px) minmax(0,1fr) 70px;gap:12px;align-items:center;padding:7px 16px}
.srow span:last-child{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}

.gtools{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding:12px}
.gtools label{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12.5px}
.gtools select{width:auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 12px;cursor:pointer}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.g-scroll{overflow:auto;max-height:calc(100vh - 250px);min-height:280px;border-top:1px solid var(--line)}
.gantt{position:relative}
.g-head{position:sticky;top:0;z-index:6;background:var(--surface);border-bottom:1px solid var(--line)}
.g-hrow{display:flex}
.g-corner{position:sticky;left:0;z-index:7;flex:0 0 176px;background:var(--surface);padding:8px 12px;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border-right:1px solid var(--line);display:flex;align-items:flex-end}
.g-m{flex:none;border-left:1px solid var(--line);padding:7px 0 7px 8px;font-size:12px;font-weight:500;color:var(--muted);overflow:hidden;white-space:nowrap}
.g-d{flex:none;text-align:center;font-size:9.5px;color:var(--muted);padding:2px 0;border-left:1px solid transparent;font-variant-numeric:tabular-nums}
.g-d.we{background:var(--weekend)}
.g-body{position:relative}
.g-row{display:flex;border-bottom:1px solid var(--line)}
.g-label{position:sticky;left:0;z-index:4;flex:0 0 176px;background:var(--surface);border-right:1px solid var(--line);padding:4px 12px;display:flex;flex-direction:column;justify-content:center;min-width:0;height:30px;line-height:1.15}
.g-label small{color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-group .g-label{background:var(--surface-2);font-weight:600;height:26px;flex-direction:row;align-items:center;gap:8px}
.g-group .g-track{background:var(--surface-2);height:26px}
.g-track{position:relative;flex:none;height:30px;cursor:cell}
.bar{position:absolute;z-index:2;top:4px;height:22px;border:0;border-radius:4px;padding:0 6px;font:500 11px/22px var(--font);text-align:left;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer}
.bar.warn{background:var(--warn-bg);color:var(--warn);box-shadow:inset 0 0 0 1px var(--warn)}
.bar.info{background:var(--info-bg);color:var(--info);box-shadow:inset 0 0 0 1px var(--info)}
.bar.acc{background:var(--accent);color:var(--accent-fg)}
.bar.done{background:var(--surface-2);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.bar.maint{background:repeating-linear-gradient(135deg,var(--hatch1) 0 5px,var(--hatch2) 5px 10px);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line)}
.bar.off{opacity:.55;text-decoration:line-through}
.g-over{position:absolute;top:0;bottom:0;left:176px;pointer-events:none}
.g-over i{position:absolute;top:0;bottom:0;width:1px;background:var(--line);z-index:1}
.g-over i.today{width:2px;background:var(--bad);z-index:3}
.lg{padding:10px 12px;border-top:1px solid var(--line)}
.lg i.h{background:repeating-linear-gradient(135deg,var(--hatch1) 0 3px,var(--hatch2) 3px 6px)}

/* logo: SVG propio, toma los colores del tema (claro y oscuro) */
.logo{display:flex}
.logo svg{display:block;width:100%;max-width:196px;height:auto}
.lg-tile{fill:var(--accent)}
.lg-mark{fill:var(--accent-fg)}
.lg-stroke{stroke:var(--accent-fg);fill:none}
.lg-name{font-family:var(--font);font-weight:600;font-size:27px;letter-spacing:-.01em}
.lg-a{fill:var(--fg)}
.lg-b{fill:var(--accent)}
.lg-sub{font-family:var(--font);font-weight:500;font-size:9.5px;letter-spacing:.14em;fill:var(--muted)}
.live{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.live h3{font-size:13px;font-weight:600}
.rsrow{display:flex;justify-content:space-between;gap:12px;padding:3px 0;font-variant-numeric:tabular-nums}
.rsrow span:first-child{min-width:0;overflow-wrap:anywhere}
.rsrow.tot{border-top:1px solid var(--line);margin-top:4px;padding-top:7px;font-weight:600}
.rsrow.mut{color:var(--muted)}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.hint.warn{color:var(--warn)}
.adl{display:flex;flex-direction:column;gap:6px}
.ad{display:grid;grid-template-columns:minmax(0,1fr) auto 64px;gap:10px;align-items:center;padding:6px 8px;border:1px solid var(--line);border-radius:6px}
.ad label{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--fg)}
.ad input[type=number]{padding:3px 6px}
.photos{display:flex;flex-direction:column;gap:10px}
.ph-add{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ph-add select{width:auto;flex:1 1 150px}
.filebtn{position:relative;cursor:pointer;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;padding:0}
.ph-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.ph{display:flex;flex-direction:column;gap:3px;min-width:0}
.th{display:block;padding:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface-2);cursor:zoom-in;aspect-ratio:4/3;width:100%}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.ph small{display:flex;justify-content:space-between;gap:4px;font-size:11.5px;color:var(--muted)}
.ph small button{border:0;background:none;color:var(--bad);cursor:pointer;padding:0;font-size:11.5px}
.cmp{display:grid;grid-template-columns:minmax(64px,.6fr) 1fr 1fr;gap:8px 10px;align-items:start}
.cmp .ch{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.cmp .zn{font-size:12.5px;color:var(--muted);padding-top:4px}
.cmp .cell{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.cmp .th{width:84px}
.nophoto{display:flex;align-items:center;justify-content:center;width:84px;aspect-ratio:4/3;border:1px dashed var(--line);border-radius:6px;color:var(--muted);font-size:11.5px}
.lb{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.84);display:flex;align-items:center;justify-content:center;padding:20px;cursor:zoom-out}
.lb[hidden]{display:none}
.lb img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
@media (max-width:1180px){ .mod{grid-template-columns:minmax(0,1fr)} .form-card{position:static} }
@media (max-width:880px){
  .shell{grid-template-columns:minmax(0,1fr);gap:14px}
  .side{position:static}
  .nav{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
  .ngroup{flex-direction:row;gap:4px}
  .ngroup small{display:none}
  .nav a{white-space:nowrap;border:1px solid var(--line);background:var(--surface)}
  .nav a em{display:none}
  .stat{border-right:0;border-bottom:1px solid var(--line)}
  .srow{grid-template-columns:90px minmax(0,1fr) 54px;gap:8px}
}
@media (prefers-reduced-motion:no-preference){ .btn,.nav a{transition:background .12s,filter .12s} }
</style>

<div class="shell">
  <aside class="side">
    <div class="brand">
      <div class="logo"><svg viewBox="0 0 230 58" role="img" aria-label="Moby, gestión de alquiler de vehículos" xmlns="http://www.w3.org/2000/svg">
        <rect class="lg-tile" x="3" y="5" width="48" height="48" rx="13"/>
        <rect class="lg-mark" x="14.5" y="16" width="7" height="26" rx="3.5"/>
        <rect class="lg-mark" x="32.5" y="16" width="7" height="26" rx="3.5"/>
        <path class="lg-stroke" d="M18 19.5 L27 32 L36 19.5" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="62" y="34" class="lg-name"><tspan class="lg-a">Mo</tspan><tspan class="lg-b">by</tspan></text>
        <text x="63" y="48" class="lg-sub">GESTIÓN DE ALQUILER</text>
      </svg></div>
      <span class="chip" id="chip"><i></i><span>Conectando…</span></span>
    </div>
    <nav class="nav" id="nav" aria-label="Módulos"></nav>
  </aside>
  <div style="min-width:0;display:flex;flex-direction:column;gap:16px">
    <div id="banner"></div>
    <main id="main"></main>
  </div>
</div>

<div class="lb" id="lb" hidden role="dialog" aria-label="Foto ampliada"><img alt="Foto ampliada"></div>

<script>
(function(){
'use strict';

/* ---------- utilidades ---------- */
var $=function(s,r){return (r||document).querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var pad=function(n,l){return String(n).padStart(l||2,'0')};
var todayStr=function(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var nowTime=function(){var d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
var dnum=function(s){if(!s)return NaN;var p=String(s).split('-').map(Number);return Date.UTC(p[0],p[1]-1,p[2])/864e5};
var dstr=function(n){var d=new Date(n*864e5);return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())};
var fmtD=function(s){if(!s)return '';var p=s.split('-');return p[2]+'/'+p[1]+'/'+p[0]};
var fmtS=function(s){if(!s)return '';var p=s.split('-');return p[2]+'/'+p[1]};
var nf=new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0});
var fmtM=function(v){return (v===''||v==null||isNaN(v))?'':nf.format(v)};
var fmtN=function(v){return (v===''||v==null||isNaN(v))?'':Number(v).toLocaleString('es-AR')};
var uid=function(p){return p+'_'+Math.random().toString(36).slice(2,10)};
var clone=function(o){return JSON.parse(JSON.stringify(o))};
var MES=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];

/* ---------- datos ---------- */
var ENT=['sucursales','franquicias','clientes','vehiculos','tarifas','reservas','mantenimiento','controles','infracciones','adicionales','planes','movimientos'];
var data={}, idx={};
ENT.forEach(function(k){data[k]=[];idx[k]=new Map()});
function reindex(){ENT.forEach(function(k){idx[k]=new Map(data[k].map(function(r){return [r.id,r]}))})}
var get=function(k,id){return id?idx[k].get(id):undefined};

var CATS=['Económico','Compacto','Sedán','SUV','Pick-up','Utilitario','Premium'];

var vigente=function(t,f){
  if(!f)return true;var n=dnum(f);
  return (!t.desde||dnum(t.desde)<=n)&&(!t.hasta||dnum(t.hasta)>=n);
};
var pl=function(n,a,b){return n+' '+(n===1?a:b)};
function addMonths(s,n){
  var p=s.split('-').map(Number),tm=p[1]-1+n,ty=p[0]+Math.floor(tm/12),tmm=((tm%12)+12)%12;
  var dim=new Date(Date.UTC(ty,tmm+1,0)).getUTCDate();
  return ty+'-'+pad(tmm+1)+'-'+pad(Math.min(p[2],dim));
}
/* horarios de atención de la sucursal */
function horarioSuc(s,fecha){
  if(!s)return null;
  var hs=[s.lvDesde,s.lvHasta,s.sabDesde,s.sabHasta,s.domDesde,s.domHasta];
  if(!hs.some(function(x){return x}))return null;
  var fer=String(s.feriados||'').split(/[\s,;]+/).indexOf(fecha)>=0;
  var wd=new Date(dnum(fecha)*864e5).getUTCDay();
  var g=(fer||wd===0)?['domDesde','domHasta']:(wd===6?['sabDesde','sabHasta']:['lvDesde','lvHasta']);
  return (s[g[0]]&&s[g[1]])?[s[g[0]],s[g[1]]]:[];
}
function chequeoHora(sucId,fecha,hora){
  var s=get('sucursales',sucId);
  if(!s||!fecha||!hora)return {fuera:null,why:'falta'};
  var h=horarioSuc(s,fecha);
  if(h===null)return {fuera:null,why:'sinhorario',suc:s};
  if(!h.length)return {fuera:true,suc:s,h:h};
  return {fuera:(hora<h[0]||hora>h[1]),suc:s,h:h};
}
function recargoAd(){return data.adicionales.filter(function(a){return a.cobro==='Por atención fuera de horario'&&a.activo!=='No'})[0]}
/* desglose del precio de una reserva: alquiler + adicionales + recargo fuera de horario */
function desglose(d){
  var t=get('tarifas',d.tarifaId);
  if(!t||!d.desde||!d.hasta||!t.precioDia)return null;
  var days=Math.max(1,dnum(d.hasta)-dnum(d.desde)),base;
  if(t.precioSemana&&days>=7){var w=Math.floor(days/7);base=Math.round(w*t.precioSemana+(days-w*7)*t.precioDia)}
  else base=Math.round(days*t.precioDia);
  var lines=[],ext=0;
  (Array.isArray(d.adicionales)?d.adicionales:[]).forEach(function(x){
    var a=get('adicionales',x.id);if(!a)return;
    var c=Math.max(1,parseInt(x.cant,10)||1),porDia=a.cobro==='Por día';
    var m=Math.round((Number(a.precio)||0)*(porDia?days:1)*c);
    ext+=m;lines.push({n:a.nombre+(c>1?' × '+c:'')+(porDia?' ('+pl(days,'día','días')+')':''),m:m});
  });
  var r1=chequeoHora(d.sucursalRetiroId,d.desde,d.horaRetiro),r2=chequeoHora(d.sucursalDevId,d.hasta,d.horaDev);
  var n=(r1.fuera===true?1:0)+(r2.fuera===true?1:0),rec=recargoAd(),fuera=0;
  if(n&&rec&&!d.exentoRecargo)fuera=Math.round((Number(rec.precio)||0)*n);
  return {days:days,base:base,lines:lines,ext:ext,r1:r1,r2:r2,n:n,rec:rec,fuera:fuera,total:base+ext+fuera};
}
function calcTotal(d){var b=desglose(d);return b?b.total:null}
/* pagos parciales: lo cobrado de una reserva surge de los movimientos de Finanzas */
function cobrado(resId,exclude){
  return data.movimientos.reduce(function(a,m){
    if(m.reservaId!==resId||m.id===exclude)return a;
    var v=Number(m.monto)||0;
    if(m.tipo==='Ingreso')return a+v;
    if(m.tipo==='Gasto'&&m.categoria==='Reintegro a cliente')return a-v;
    return a;
  },0);
}
function pagoEstado(r){
  var c=cobrado(r.id),t=Number(r.total)||0;
  return c<=0?'Sin pago':(t>0&&c>=t?'Pago total':'Pago parcial');
}
/* alertas de mantenimiento por kilometraje o fecha */
function planEstado(p){
  var v=get('vehiculos',p.vehiculoId),hoy=dnum(todayStr());
  var o={estado:'Al día',lvl:0,proxKm:null,proxFecha:null,restKm:null,restDias:null};
  if(p.activo==='No'){o.estado='Inactivo';return o}
  var useKm=p.modo!=='Por fecha',useF=p.modo!=='Por kilometraje';
  if(useKm&&p.cadaKm!==''&&p.cadaKm!=null&&p.ultimoKm!==''&&p.ultimoKm!=null){
    o.proxKm=Number(p.ultimoKm)+Number(p.cadaKm);
    o.restKm=o.proxKm-(v?Number(v.km)||0:0);
    var l=o.restKm<=0?2:(o.restKm<=(Number(p.avisoKm)||0)?1:0);
    if(l>o.lvl)o.lvl=l;
  }
  if(useF&&p.cadaMeses&&p.ultimaFecha){
    o.proxFecha=addMonths(p.ultimaFecha,Number(p.cadaMeses));
    o.restDias=dnum(o.proxFecha)-hoy;
    var l2=o.restDias<0?2:(o.restDias<=(Number(p.avisoDias)||0)?1:0);
    if(l2>o.lvl)o.lvl=l2;
  }
  o.estado=['Al día','Próximo','Vencido'][o.lvl];
  return o;
}
function planFalta(p,o){
  var a=[];
  if(o.restKm!=null)a.push(o.restKm<0?'pasado por '+fmtN(-o.restKm)+' km':(o.restKm===0?'llegó al kilometraje':'faltan '+fmtN(o.restKm)+' km'));
  if(o.restDias!=null)a.push(o.restDias<0?'vencido hace '+pl(-o.restDias,'día','días'):(o.restDias===0?'vence hoy':'faltan '+pl(o.restDias,'día','días')));
  return a.join(' · ');
}
async function syncPlanes(rec){
  if(rec.estado!=='Finalizado')return;
  var v=get('vehiculos',rec.vehiculoId),fecha=rec.fechaHasta||rec.fecha;
  var km=(rec.kmActual!==''&&rec.kmActual!=null)?Number(rec.kmActual):(v?Number(v.km)||0:null);
  var ps=data.planes.slice();
  for(var i=0;i<ps.length;i++){
    var p=ps[i];
    if(p.vehiculoId!==rec.vehiculoId||p.tarea!==rec.tipo||p.activo==='No')continue;
    if(p.ultimaFecha&&fecha&&dnum(fecha)<dnum(p.ultimaFecha))continue;
    var np=Object.assign({},p);
    if(fecha)np.ultimaFecha=fecha;
    if(km!=null&&!isNaN(km))np.ultimoKm=km;
    await put('planes',np);
  }
}
function resSpan(r){var s=dnum(r.desde);return [s,Math.max(dnum(r.hasta),s+1)]}
function mntSpan(m){var s=dnum(m.fecha);return [s,Math.max(dnum(m.fechaHasta||m.fecha),s)+1]}

/* ---------- estado de la interfaz ---------- */
var ui={mod:'panel',sel:null,mode:'view',draft:null,dirty:false,msg:null,confirmDel:false,q:'',flt:'',fMes:todayStr().slice(0,7),newPh:[],rmPh:[],
  gYear:new Date().getFullYear(),gSuc:'',gZoom:'fit',gCancel:false,gPpd:3,gD0:0,
  ready:false,stale:false,got:{},mode_store:'',clearAsk:false,busy:false};
var main=$('#main');

/* ---------- almacenamiento: db compartida o navegador ---------- */
var dbh=null, LS='gestor-flota:v1';
function persistLocal(){try{localStorage.setItem(LS,JSON.stringify(data))}catch(e){}}
async function put(k,rec){
  var body=clone(rec);
  if(dbh){await dbh.collection(k).doc(body.id).set(body)}
  else{
    var i=data[k].findIndex(function(r){return r.id===body.id});
    if(i>=0)data[k][i]=body;else data[k].push(body);
    reindex();persistLocal();
  }
}
async function del(k,id){
  if(dbh){await dbh.collection(k).doc(id).delete()}
  else{data[k]=data[k].filter(function(r){return r.id!==id});reindex();persistLocal()}
}
function errText(e){
  var c=e&&e.code;
  if(c==='invalid_argument')return 'No se pudo guardar. Este usuario puede no tener permiso para modificar los datos.';
  if(c==='quota_exceeded')return 'Se alcanzó el límite de almacenamiento de la aplicación.';
  if(c==='resource_exhausted')return 'Demasiadas operaciones seguidas. Esperar unos segundos y reintentar.';
  return 'No se pudo completar la operación. Reintentar en unos segundos.';
}
function setChip(){
  var c=$('#chip');
  c.className='chip'+(dbh?' on':'');
  c.lastChild.textContent=!ui.mode_store?'Conectando…':(dbh?'Datos compartidos':'Solo en este navegador');
}
function checkReady(){
  if(!ui.ready&&Object.keys(ui.got).length===ENT.length){ui.ready=true;clearTimeout(ui.timer)}
}
function initLocal(){
  dbh=null;ui.mode_store='local';
  try{var raw=JSON.parse(localStorage.getItem(LS)||'null');if(raw)ENT.forEach(function(k){if(Array.isArray(raw[k]))data[k]=raw[k]})}catch(e){}
  reindex();ui.ready=true;clearTimeout(ui.timer);setChip();render();
}
function initDb(db){
  dbh=db;ui.mode_store='db';setChip();
  ENT.forEach(function(k){
    db.collection(k).onSnapshot(function(snap){
      data[k]=snap.docs.map(function(d){return Object.assign({},d.data(),{id:d.id})});
      ui.got[k]=1;if(!snap.metadata.fromCache)ui.stale=false;
      reindex();var was=ui.ready;checkReady();
      if(!was&&ui.ready)render();else refresh();
    },function(){ui.got[k]=1;var was=ui.ready;checkReady();if(!was&&ui.ready)render();else refresh()});
  });
}
function boot(){
  ui.timer=setTimeout(function(){if(!ui.ready){ui.ready=true;ui.stale=true;render()}},10000);
  if(!(window.claude&&window.claude.use)){initLocal();return}
  window.claude.use('assets').then(function(a){assetsH=a;if(a&&ui.mod==='controles'&&ui.mode!=='view')renderForm()}).catch(function(){});
  window.claude.use('db').then(function(db){if(db)initDb(db);else initLocal()}).catch(initLocal);
}

/* ---------- navegación ---------- */
function renderNav(){
  $('#nav').innerHTML=NAV.map(function(g){
    return '<div class="ngroup"><small>'+g[0]+'</small>'+g[1].map(function(i){
      var on=ui.mod===(ROUTE[i[0]]);
      return '<a href="#'+i[0]+'" class="'+(on?'on':'')+'"'+(on?' aria-current="page"':'')+'><span>'+i[1]+'</span>'+(i[2]?'<em>'+data[i[2]].length+'</em>':'')+'</a>';
    }).join('')+'</div>';
  }).join('');
}
function route(){
  var h=(location.hash||'').replace('#','');
  var m=ROUTE[h]||ui.mod||'panel';
  if(m!==ui.mod||!main.firstChild){
    if(ui.mod!==m){ui.sel=null;ui.mode='view';ui.draft=null;ui.dirty=false;ui.msg=null;ui.confirmDel=false;ui.q='';ui.flt=''}
    ui.mod=m;
  }
  render();
}
function go(mod){location.hash='#'+HASH[mod]}

/* ---------- banners ---------- */
function hasExamples(){return ENT.some(function(k){return data[k].some(function(r){return r._ejemplo})})}
function renderBanner(){
  var h='';
  if(ui.stale)h+='<div class="note warn"><span>No se pudo confirmar la conexión con los datos guardados. Lo que se ve puede estar desactualizado.</span></div>';
  if(hasExamples()){
    h+='<div class="note"><span>Se están mostrando datos de ejemplo para probar la aplicación. Se pueden borrar todos juntos antes de cargar los propios.</span>'+
      (ui.clearAsk?'<span><button class="btn sm danger" data-act="clearyes"'+(ui.busy?' disabled':'')+'>'+(ui.busy?'Borrando…':'Sí, borrar ejemplos')+'</button> <button class="btn sm" data-act="clearno"'+(ui.busy?' disabled':'')+'>Conservar</button></span>':'<button class="btn sm" data-act="clearask">Borrar datos de ejemplo</button>')+'</div>';
  }
  $('#banner').innerHTML=h;
}
async function clearExamples(){
  ui.busy=true;renderBanner();
  try{
    var jobs=[];ENT.forEach(function(k){data[k].filter(function(r){return r._ejemplo}).forEach(function(r){jobs.push([k,r.id])})});
    for(var i=0;i<jobs.length;i+=6){await Promise.all(jobs.slice(i,i+6).map(function(j){return del(j[0],j[1])}))}
  }catch(e){ui.msg={t:'err',x:errText(e)}}
  ui.busy=false;ui.clearAsk=false;ui.sel=null;ui.draft=null;ui.mode='view';reindex();render();
}

/* ---------- render general ---------- */
function render(){
  renderNav();renderBanner();setChip();
  if(!ui.ready){main.innerHTML='<div class="card pad"><p>Cargando datos…</p></div>';return}
  if(ui.mod==='panel')main.innerHTML=viewPanel();
  else if(ui.mod==='calendario'){main.innerHTML=viewGantt();afterGantt()}
  else{main.innerHTML=viewModule(ui.mod);renderList();renderForm()}
}
function refresh(){
  if(!ui.ready)return;
  renderNav();renderBanner();setChip();
  if(ui.mod!=='panel'&&ui.mod!=='calendario'&&!$('#list')){render();return}
  if(ui.mod==='panel'||ui.mod==='calendario'){
    var sc=$('.g-scroll'),x=sc?sc.scrollLeft:0,y=sc?sc.scrollTop:0;
    render();
    var sc2=$('.g-scroll');if(sc2){sc2.scrollLeft=x;sc2.scrollTop=y}
  }else{
    if(ui.sel&&ui.mode==='view'&&!get(ui.mod,ui.sel)){ui.sel=null;ui.draft=null;ui.confirmDel=false}
    refreshTop();renderList();
    if(ui.mode==='view')renderForm();
  }
}

/* ---------- panel ---------- */
function viewPanel(){
  var hoy=todayStr(),hn=dnum(hoy),mes=hoy.slice(0,7);
  var veh=data.vehiculos.filter(function(v){return v.estado!=='Baja'});
  var c=function(e){return veh.filter(function(v){return v.estado===e}).length};
  var act=data.reservas.filter(function(r){return r.estado!=='Cancelada'});
  var enCurso=act.filter(function(r){return r.estado==='En curso'}).length;
  var fact=act.filter(function(r){return (r.desde||'').slice(0,7)===mes}).reduce(function(a,r){return a+(Number(r.total)||0)},0);
  var inf=data.infracciones.filter(function(i){return i.estado!=='Pagada'});
  var infMonto=inf.reduce(function(a,i){return a+(Number(i.monto)||0)},0);
  var taller=data.mantenimiento.filter(function(m){return m.estado==='En taller'||m.estado==='Programado'}).length;
  var ingMes=0,gasMes=0;
  data.movimientos.forEach(function(m){if((m.fecha||'').slice(0,7)!==mes)return;var v=Number(m.monto)||0;if(m.tipo==='Ingreso')ingMes+=v;else gasMes+=v});
  var porCobrar=act.reduce(function(a,r){return a+Math.max(0,(Number(r.total)||0)-cobrado(r.id))},0);
  var alertas=data.planes.map(function(p){return {p:p,o:planEstado(p)}}).filter(function(x){return x.o.lvl>0}).sort(function(a,b){return b.o.lvl-a.o.lvl});

  var mov=[];
  act.forEach(function(r){
    var cli=get('clientes',r.clienteId),v=get('vehiculos',r.vehiculoId);
    var sub=(cli?cli.apellido+', '+cli.nombre:'')+(v?' · '+v.patente:'');
    if((r.estado==='Pendiente'||r.estado==='Confirmada')&&dnum(r.desde)>=hn&&dnum(r.desde)<=hn+7)mov.push({f:r.desde,t:'Retiro',tone:'info',s:sub,id:r.id});
    if(r.estado==='En curso'){
      if(dnum(r.hasta)<hn)mov.push({f:r.hasta,t:'Devolución vencida',tone:'bad',s:sub,id:r.id});
      else if(dnum(r.hasta)<=hn+7)mov.push({f:r.hasta,t:'Devolución',tone:'acc',s:sub,id:r.id});
    }
  });
  mov.sort(function(a,b){return a.f.localeCompare(b.f)});

  var venc=[];
  var add=function(f,tx){if(!f)return;var d=dnum(f)-hn;if(d<=30)venc.push({d:d,f:f,x:tx})};
  veh.forEach(function(v){add(v.vtvVence,'VTV · '+v.patente);add(v.seguroVence,'Seguro · '+v.patente)});
  data.franquicias.forEach(function(f){if(f.estado==='Vigente')add(f.fechaVence,'Contrato de franquicia · '+f.nombre)});
  inf.forEach(function(i){var v=get('vehiculos',i.vehiculoId);add(i.vence,'Pago de infracción · '+(v?v.patente:'')+(i.acta?' · acta '+i.acta:''))});
  act.filter(function(r){return r.estado==='Confirmada'||r.estado==='En curso'}).forEach(function(r){
    var cli=get('clientes',r.clienteId);if(cli&&cli.venceLicencia&&dnum(cli.venceLicencia)<=dnum(r.hasta)+0)add(cli.venceLicencia,'Licencia de '+cli.apellido+' ('+r.nro+')');
  });
  venc.sort(function(a,b){return a.d-b.d});

  var sucs=data.sucursales.slice().sort(function(a,b){return a.nombre.localeCompare(b.nombre)});
  var rows=sucs.map(function(s){
    var vs=veh.filter(function(v){return v.sucursalId===s.id});
    var n=vs.length||1;
    var d=vs.filter(function(v){return v.estado==='Disponible'}).length,a=vs.filter(function(v){return v.estado==='Alquilado'}).length,m=vs.filter(function(v){return v.estado==='Mantenimiento'}).length;
    return '<div class="srow"><span>'+esc(s.nombre)+'</span><div class="sbar" title="'+d+' disponibles, '+a+' alquilados, '+m+' en mantenimiento"><i class="d" style="width:'+(d/n*100)+'%"></i><i class="a" style="width:'+(a/n*100)+'%"></i><i class="m" style="width:'+(m/n*100)+'%"></i></div><span>'+vs.length+' veh.</span></div>';
  }).join('');

  var dtxt=function(d){return d<0?'vencido hace '+(-d)+(d===-1?' día':' días'):(d===0?'vence hoy':'en '+d+(d===1?' día':' días'))};
  return '<div class="mhead"><div><h1>Panel</h1><p class="sub">'+fmtD(hoy)+' · resumen de la operación</p></div></div>'+
  '<section class="card"><div class="strip">'+
    '<div class="stat"><span>Flota activa</span><b>'+veh.length+'</b></div>'+
    '<div class="stat"><span>Disponibles</span><b>'+c('Disponible')+'</b></div>'+
    '<div class="stat"><span>Alquilados</span><b>'+c('Alquilado')+'</b></div>'+
    '<div class="stat"><span>En mantenimiento</span><b>'+c('Mantenimiento')+'</b></div></div>'+
  '<div class="strip">'+
    '<div class="stat"><span>Reservas en curso</span><b>'+enCurso+'</b></div>'+
    '<div class="stat"><span>Facturación estimada del mes</span><b class="sm">'+fmtM(fact)+'</b></div>'+
    '<div class="stat"><span>Infracciones sin pagar</span><b>'+inf.length+'</b><span>'+fmtM(infMonto)+'</span></div>'+
    '<div class="stat"><span>Trabajos de taller abiertos</span><b>'+taller+'</b></div></div>'+
  '<div class="strip">'+
    '<div class="stat"><span>Ingresos del mes</span><b class="sm">'+fmtM(ingMes)+'</b></div>'+
    '<div class="stat"><span>Gastos del mes</span><b class="sm">'+fmtM(gasMes)+'</b></div>'+
    '<div class="stat"><span>Resultado del mes</span><b class="sm">'+fmtM(ingMes-gasMes)+'</b></div>'+
    '<div class="stat"><span>Saldo por cobrar</span><b class="sm">'+fmtM(porCobrar)+'</b></div></div></section>'+
  '<section class="card"><div class="chead"><h2>Alertas de service</h2><span class="sub">por kilometraje o fecha</span></div><ul class="list">'+
    (alertas.length?alertas.slice(0,8).map(function(x){var v=get('vehiculos',x.p.vehiculoId);return '<li><div><p><span class="badge '+(x.o.lvl===2?'bad':'warn')+'">'+x.o.estado+'</span> '+esc(v?v.patente+' · '+(v.marca||'')+' '+(v.modelo||''):'?')+' · '+esc(x.p.tarea)+'</p><p class="sub">'+esc(planFalta(x.p,x.o))+'</p></div><button class="btn sm" data-act="planprog" data-id="'+esc(x.p.id)+'">Programar</button></li>'}).join(''):'<li class="empty" style="display:block;border-top:1px solid var(--line)">'+(data.planes.length?'Todos los planes están al día.':'Todavía no hay planes. Se crean en Alertas de service.')+'</li>')+
  '</ul></section>'+
  '<div class="two">'+
    '<section class="card"><div class="chead"><h2>Retiros y devoluciones</h2><span class="sub">próximos 7 días</span></div><ul class="list">'+
      (mov.length?mov.slice(0,10).map(function(m){return '<li><div><p><span class="badge '+m.tone+'">'+m.t+'</span> '+fmtD(m.f)+'</p><p class="sub">'+esc(m.s)+'</p></div><button class="btn sm" data-act="openres" data-id="'+m.id+'">Abrir</button></li>'}).join(''):'<li class="empty" style="display:block;border-top:1px solid var(--line)">No hay movimientos programados.</li>')+
    '</ul></section>'+
    '<section class="card"><div class="chead"><h2>Vencimientos</h2><span class="sub">próximos 30 días</span></div><ul class="list">'+
      (venc.length?venc.slice(0,10).map(function(v){return '<li><div><p>'+esc(v.x)+'</p><p class="sub">'+fmtD(v.f)+'</p></div><span class="badge '+(v.d<0?'bad':v.d<=7?'warn':'')+'">'+dtxt(v.d)+'</span></li>'}).join(''):'<li class="empty" style="display:block;border-top:1px solid var(--line)">Sin vencimientos cercanos.</li>')+
    '</ul></section></div>'+
  '<section class="card"><div class="chead"><h2>Flota por sucursal</h2><div class="legend"><span><i style="background:var(--ok)"></i>Disponible</span><span><i style="background:var(--accent)"></i>Alquilado</span><span><i style="background:var(--warn)"></i>Mantenimiento</span></div></div>'+
    (rows||'<div class="empty">Todavía no hay sucursales cargadas.</div>')+'<div style="height:8px"></div></section>';
}

/* ---------- módulo CRUD ---------- */
function viewModule(k){
  var sch=S[k],est=sch.fields.filter(function(f){return f.k==='estado'})[0]||sch.fields.filter(function(f){return f.k==='tipo'})[0];
  var fo=sch.flt||est;
  var flt=fo?'<select id="flt" aria-label="Filtrar"><option value="">Todos</option>'+fo.o.map(function(o){return '<option'+(ui.flt===o?' selected':'')+'>'+esc(o)+'</option>'}).join('')+'</select>':'';
  return '<div class="mhead"><div><h1>'+sch.t+'</h1><p class="sub" id="sub"></p></div></div>'+
  (sch.top?'<div id="top">'+sch.top()+'</div>':'')+
  '<div class="mod"><section class="card"><div class="list-tools"><input id="q" type="search" placeholder="Buscar en '+sch.t.toLowerCase()+'…" value="'+esc(ui.q)+'" aria-label="Buscar">'+flt+'<button class="btn primary" data-act="new">Nuevo</button></div><div class="tbl-wrap" id="list"></div></section>'+
  '<aside class="card form-card" id="formPanel" aria-label="Ficha"></aside></div>';
}
function cellHTML(f,r){
  var v=r[f.k];
  if(f.t==='ref')return esc(refText(f.ref,v));
  if(f.t==='date')return fmtD(v)+(f.hora&&r[f.hora]?' '+esc(r[f.hora]):'');
  if(f.t==='money')return fmtM(v);
  if(f.t==='number')return f.raw?esc(v):fmtN(v);
  if(f.t==='check')return v?'Sí':'No';
  if(f.badge)return badge(v);
  if(f.mono)return '<span class="mono">'+esc(v)+'</span>';
  return esc(v);
}
function plain(f,r){var v=r[f.k];if(f.t==='ref')return refText(f.ref,v);if(f.t==='date')return fmtD(v);if(f.t==='money')return fmtM(v);return v==null?'':String(v)}
function renderList(){
  var k=ui.mod,sch=S[k],cols=sch.fields.filter(function(f){return f.list});
  var rows=data[k].slice();
  var first=cols[0];
  rows.sort(sch.sort||function(a,b){return plain(first,a).localeCompare(plain(first,b),'es')});
  var q=ui.q.trim().toLowerCase();
  var fkey=(sch.fields.filter(function(f){return f.k==='estado'})[0]||sch.fields.filter(function(f){return f.k==='tipo'})[0]||{}).k;
  var vis=rows.filter(function(r){
    if(ui.flt&&sch.flt&&sch.flt.f(r)!==ui.flt)return false;
    if(ui.flt&&!sch.flt&&fkey&&r[fkey]!==ui.flt)return false;
    if(sch.rowFilter&&!sch.rowFilter(r))return false;
    if(!q)return true;
    return cols.map(function(f){return plain(f,r)}).join(' ').toLowerCase().indexOf(q)>=0;
  });
  var sub=$('#sub');if(sub)sub.textContent=vis.length===data[k].length?data[k].length+(data[k].length===1?' registro':' registros'):vis.length+' de '+data[k].length+' registros';
  var h;
  if(!data[k].length)h='<div class="empty">Todavía no hay registros. Usar «Nuevo» para cargar el primero.</div>';
  else if(!vis.length)h='<div class="empty">Ningún registro coincide con la búsqueda.</div>';
  else{
    var ex=sch.extra||[];
    h='<table><thead><tr>'+cols.map(function(f){return '<th>'+esc(f.lc||f.l)+'</th>'}).join('')+ex.map(function(e){return '<th>'+esc(e.l)+'</th>'}).join('')+'</tr></thead><tbody>'+
      vis.map(function(r){
        return '<tr tabindex="0" data-act="sel" data-id="'+esc(r.id)+'" class="'+(r.id===ui.sel?'sel':'')+'">'+cols.map(function(f){return '<td>'+cellHTML(f,r)+'</td>'}).join('')+ex.map(function(e){return '<td>'+(e.h?e.f(r):esc(e.f(r)))+'</td>'}).join('')+'</tr>';
      }).join('')+'</tbody></table>';
  }
  $('#list').innerHTML=h;
}

function control(f,val,off){
  var id='f_'+f.k,dis=(off||f.ro)?' disabled':'';
  var v=val==null?'':val;
  if(f.t==='fotos')return photosControl(val,off);
  if(f.t==='extras')return extrasControl(val,off);
  if(f.t==='select'){
    var ops=typeof f.o==='function'?f.o(ui.draft||{}):f.o;
    return '<select id="'+id+'" data-f="'+f.k+'"'+dis+'><option value="">—</option>'+ops.map(function(o){return '<option value="'+esc(o)+'"'+(o===v?' selected':'')+'>'+esc(o)+'</option>'}).join('')+'</select>';
  }
  if(f.t==='ref'){
    var opts=data[f.ref].slice().sort(function(a,b){return L[f.ref](a).localeCompare(L[f.ref](b),'es')});
    var miss=v&&!get(f.ref,v)?'<option value="'+esc(v)+'" selected>(registro eliminado)</option>':'';
    return '<select id="'+id+'" data-f="'+f.k+'"'+dis+'><option value="">—</option>'+miss+opts.map(function(o){return '<option value="'+esc(o.id)+'"'+(o.id===v?' selected':'')+'>'+esc(L[f.ref](o))+'</option>'}).join('')+'</select>';
  }
  if(f.t==='textarea')return '<textarea id="'+id+'" data-f="'+f.k+'"'+dis+'>'+esc(v)+'</textarea>';
  if(f.t==='check')return '<label style="display:flex;gap:8px;align-items:center;font-size:14px;color:var(--fg)"><input type="checkbox" id="'+id+'" data-f="'+f.k+'"'+(v?' checked':'')+dis+'>'+esc(f.l)+'</label>';
  var type=f.t==='money'||f.t==='number'?'number':f.t;
  var extra=type==='number'?' step="'+(f.step||'any')+'" inputmode="decimal"'+(f.t==='money'?' min="0"':''):'';
  return '<input id="'+id+'" data-f="'+f.k+'" type="'+type+'" value="'+esc(v)+'"'+extra+(f.ph?' placeholder="'+esc(f.ph)+'"':'')+dis+'>';
}
/* ---------- fotos, adicionales y comparación ---------- */
var assetsH=null;
function photosControl(val,off){
  var arr=Array.isArray(val)?val:[];
  var h='<div id="photos" class="photos">';
  if(!off){
    h+='<div class="ph-add"><select id="ph_zona" aria-label="Zona de la foto">'+ZONAS.map(function(z){return '<option>'+esc(z)+'</option>'}).join('')+'</select>'+
      '<span class="btn sm filebtn">Tomar foto<input type="file" accept="image/*" capture="environment" data-ph="file" aria-label="Tomar foto"></span>'+
      '<span class="btn sm filebtn">Elegir de la galería<input type="file" accept="image/*" multiple data-ph="file" aria-label="Elegir fotos"></span></div>'+
      '<p class="hint" id="ph_status" role="status">'+(arr.length?pl(arr.length,'foto cargada.','fotos cargadas.'):'Elegir la zona y cargar las fotos del vehículo.')+'</p>';
  }
  if(arr.length){
    h+='<div class="ph-grid">'+arr.map(function(p,i){
      return '<div class="ph"><button type="button" class="th" data-act="zoom" data-url="'+esc(p.url)+'" aria-label="Ampliar foto de '+esc(p.zona)+'"><img src="'+esc(p.url)+'" alt="'+esc(p.zona)+'" loading="lazy"></button><small><span>'+esc(p.zona)+'</span>'+(off?'':'<button type="button" data-act="phdel" data-i="'+i+'" aria-label="Quitar foto">Quitar</button>')+'</small></div>';
    }).join('')+'</div>';
  }else if(off)h+='<p class="hint">Sin fotos cargadas.</p>';
  return h+'</div>';
}
function extrasControl(val,off){

function compareHTML(d){

function shrink(file){
  return new Promise(function(res){
    var url=URL.createObjectURL(file),img=new Image();
    img.onload=function(){
      try{
        var s=Math.min(1,1600/Math.max(img.naturalWidth,img.naturalHeight)),c=document.createElement('canvas');
        c.width=Math.max(1,Math.round(img.naturalWidth*s));c.height=Math.max(1,Math.round(img.naturalHeight*s));
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        c.toBlob(function(b){URL.revokeObjectURL(url);res(b||file)},'image/jpeg',0.82);
      }catch(e){URL.revokeObjectURL(url);res(file)}
    };
    img.onerror=function(){URL.revokeObjectURL(url);res(file)};
    img.src=url;
  });
}
async function addPhotos(input){

  if(!Array.isArray(d.fotos))d.fotos=[];

    case 'clearyes':clearExamples();break;
    case 'gtoday':ui.gYear=new Date().getFullYear();ui.gZoom='detail';ui.gScrollNext=true;render();break;
    case 'openres':case 'gres':ui.sel=null;ui.mode='view';ui.draft=null;ui.mod='reservas';ui.q='';ui.flt='';
      var rr=get('reservas',t.getAttribute('data-id'));
      if(rr){ui.sel=rr.id;ui.draft=clone(rr)}
      location.hash='#reservas';render();toForm();break;
    case 'zoom':$('#lb img').src=t.getAttribute('data-url');$('#lb').hidden=false;break;
    case 'phdel':{
      var pi=Number(t.getAttribute('data-i')),parr=ui.draft&&ui.draft.fotos;
      if(parr&&parr[pi]){ui.rmPh.push(parr[pi].id);parr.splice(pi,1);ui.dirty=true;var bx=$('#photos');if(bx)bx.outerHTML=photosControl(parr,false);updateLive()}
      break}
    case 'fmesall':ui.fMes='';refreshTop();renderList();break;
    case 'planprog':{
      var pp=get('planes',t.getAttribute('data-id'));
      if(pp){ui.mod='mantenimiento';ui.q='';ui.flt='';ui.sel=null;ui.draft=null;ui.mode='view';ui.dirty=false;location.hash='#mantenimiento';render();doNew({vehiculoId:pp.vehiculoId,tipo:pp.tarea,estado:'Programado'})}
      break}
    case 'regpago':{
      var rp=get('reservas',t.getAttribute('data-id'));
      if(rp){
        var cp=cobrado(rp.id),sp=Math.max(0,(Number(rp.total)||0)-cp);
        ui.mod='movimientos';ui.q='';ui.flt='';ui.sel=null;ui.draft=null;ui.mode='view';ui.dirty=false;location.hash='#finanzas';render();
        doNew({tipo:'Ingreso',reservaId:rp.id,monto:sp,categoria:cp>0?'Saldo / pago final':'Seña'});
      }
      break}
    case 'gmnt':ui.mod='mantenimiento';ui.q='';ui.flt='';ui.mode='view';
      var mr=get('mantenimiento',t.getAttribute('data-id'));ui.sel=mr?mr.id:null;ui.draft=mr?clone(mr):null;
      location.hash='#mantenimiento';render();break;
    case 'gcell':
      if(e.target!==t)break;
      var day=ui.gD0+Math.floor((e.clientX-t.getBoundingClientRect().left)/ui.gPpd);
      ui.mod='reservas';ui.q='';ui.flt='';ui.sel=null;ui.mode='view';ui.draft=null;ui.dirty=false;
      location.hash='#reservas';
      render();
      doNew({vehiculoId:t.getAttribute('data-veh'),desde:dstr(day),hasta:dstr(day+1)});
      break;
  }
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&!$('#lb').hidden){$('#lb').hidden=true;return}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('tr[data-act="sel"]')){e.preventDefault();doSel(e.target.getAttribute('data-id'))}
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='q'){ui.q=t.value;renderList();return}
  if(t.getAttribute&&t.getAttribute('data-f')&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA')&&t.type!=='checkbox')fieldChange(t,false);
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='flt'){ui.flt=t.value;renderList();return}
  if(t.id==='fmes'){ui.fMes=t.value;refreshTop();renderList();return}
  var g=t.getAttribute&&t.getAttribute('data-g');
  if(g==='year'){ui.gYear=Number(t.value);ui.gScrollNext=false;render();return}
  if(g==='suc'){ui.gSuc=t.value;ui.gScrollNext=false;render();return}
  if(g==='canc'){ui.gCancel=t.checked;ui.gScrollNext=false;render();return}
  if(t.hasAttribute&&t.hasAttribute('data-ph')){addPhotos(t);return}
  if(t.hasAttribute&&(t.hasAttribute('data-ad')||t.hasAttribute('data-adq'))){adChange(t);return}
  if(t.getAttribute&&t.getAttribute('data-f'))fieldChange(t,true);
});
function fieldChange(t,isChange){
  if(!ui.draft||ui.mode==='view')return;
  var key=t.getAttribute('data-f'),sch=S[ui.mod];
  var f=sch.fields.filter(function(x){return x.k===key})[0];if(!f)return;
  var v;
  if(t.type==='checkbox')v=t.checked;
  else if(f.t==='number'||f.t==='money')v=t.value===''?'':Number(t.value);
  else v=t.value;
  if(ui.draft[key]===v&&!isChange)return;
  ui.draft[key]=v;ui.dirty=true;
  applyChange(key,f,isChange);
}
function applyChange(key,f,isChange){
  var sch=S[ui.mod],needRender=false;
  if(isChange&&sch.onChange){
    var ch=sch.onChange(ui.draft,key)||[];
    ch.forEach(function(ck){
      var el=$('#f_'+ck),cf=sch.fields.filter(function(x){return x.k===ck})[0];
      if(el&&cf){if(cf.t==='check')el.checked=!!ui.draft[ck];else el.value=ui.draft[ck]==null?'':ui.draft[ck]}
    });
  }
  if(isChange&&f&&f.deps)needRender=true;
  if(needRender)renderForm();else updateLive();
}
function updateLive(){
  var el=$('#live'),sch=S[ui.mod];
  if(el&&sch&&sch.live&&ui.draft)el.innerHTML=sch.live(ui.draft);
}
window.addEventListener('hashchange',route);

/* ---------- inicio ---------- */
renderNav();
if(!location.hash)ui.mod='panel';
route();
boot();
})();
</script>
